services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vi}
      POSTGRES_DB: ${POSTGRES_DB:-volleyball_intelligence}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vi} -d ${POSTGRES_DB:-volleyball_intelligence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vi}:${POSTGRES_PASSWORD:-vi}@db:5432/${POSTGRES_DB:-volleyball_intelligence}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
